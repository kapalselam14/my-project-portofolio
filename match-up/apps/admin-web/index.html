<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatchUp Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Pre-paint theme init (mirrors ThemeContext): applies the saved
      // theme before React mounts so there is no light-mode flash and
      // the saved value takes effect on first paint.
      try {
        var t = localStorage.getItem('matchup_admin_theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        var dark = t === 'dark';
        document.documentElement.classList.toggle('dark', dark);
        document.body.classList.toggle('dark', dark);
        document.documentElement.dataset.theme = t;
        document.body.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
